:root, [data-theme="ddx"] {
  --bg: #0c1413; --surface: #13201f; --surface2: #1a2b29; --line: #223634; --line2: #2c4542;
  --text: #eef6f4; --muted: #8ba6a2; --dim: #5d7774;
  --turq: #2fd6c9; --emer: #12b886; --orange: #ff7a2f;
  --on-turq: #04211e; --on-orange: #2a1000;
  --done-bg: rgba(18,184,134,.08); --sticker: #ff7a2f; --on-sticker: #2a1000;
  --scribble: #ff7a2f; --hand: #2fd6c9;
}
[data-theme="graphite"] {
  --bg: #17181b; --surface: #202226; --surface2: #292c31; --line: #30333a; --line2: #3d4148;
  --text: #f1f2f4; --muted: #b0b4bb; --dim: #7d828a;
  --turq: #8db4e0; --emer: #7cc49a; --orange: #e0b070;
  --on-turq: #10161e; --on-orange: #1e1508;
  --done-bg: rgba(124,196,154,.06); --sticker: #e0b070; --on-sticker: #1e1508;
  --scribble: transparent; --hand: #b0b4bb;
}
[data-theme="graphite"] .hand { font-family: 'Onest', system-ui, sans-serif; font-weight: 600; font-size: 13px !important; letter-spacing: .02em; }
[data-theme="graphite"] .bhead .lbl { text-transform: uppercase; font-size: 12px !important; letter-spacing: .08em; }
[data-theme="graphite"] .sticker { font: 700 11px/1 'Onest'; padding: 3px 6px; transform: none; vertical-align: 2px; }
[data-theme="graphite"] .q-card .qt .n { font-size: 14px !important; color: var(--dim); }
[data-theme="graphite"] .title h1 svg { display: none; }
[data-theme="graphite"] .nm { font-size: 14px; }
[data-theme="graphite"] .cell small, [data-theme="graphite"] .wu { color: var(--muted); }
/* ---- Galaxy (One UI) ---- */
[data-theme="galaxy"] {
  --bg: #f4f4f6; --surface: #ffffff; --surface2: #f0f0f3; --line: #ebebee; --line2: #d9d9de;
  --text: #111111; --muted: #6b6b70; --dim: #9a9aa0;
  --turq: #0381fe; --emer: #0381fe; --orange: #f2711c;
  --on-turq: #ffffff; --on-orange: #ffffff;
  --done-bg: transparent; --sticker: #e3efff; --on-sticker: #0062d1;
  --scribble: transparent; --hand: #6b6b70;
  --tabs-bg: #e7e7eb; --tab-on: #ffffff; --tab-on-text: #111111;
  --tonal: #e3efff; --on-tonal: #0062d1;
}
@media (prefers-color-scheme: dark) {
  [data-theme="galaxy"] {
    --bg: #000000; --surface: #17171a; --surface2: #26262a; --line: #26262a; --line2: #3a3a3f;
    --text: #fafafa; --muted: #a3a3a8; --dim: #707075;
    --turq: #3e91ff; --emer: #3e91ff; --orange: #ff8a3d;
    --on-turq: #ffffff; --on-orange: #1a0c00;
    --sticker: #12305a; --on-sticker: #9cc6ff; --hand: #a3a3a8;
    --tabs-bg: #1f1f23; --tab-on: #3a3a40; --tab-on-text: #ffffff;
    --tonal: #12305a; --on-tonal: #9cc6ff;
  }
}
[data-theme="galaxy"] body, [data-theme="galaxy"] html, [data-theme="galaxy"] input, [data-theme="galaxy"] textarea, [data-theme="galaxy"] button { font-family: system-ui, 'Roboto', 'Onest', sans-serif; }
[data-theme="galaxy"] .hand { font-family: inherit; font-weight: 500; font-size: 13px !important; }
[data-theme="galaxy"] header { border-bottom: 0; }
[data-theme="galaxy"] .hrow { padding: 22px 4px 12px; }
[data-theme="galaxy"] .title h1 { font: 400 30px/1.1 system-ui, 'Roboto', sans-serif; text-transform: none; letter-spacing: 0; }
[data-theme="galaxy"] .title h1 svg { display: none; }
[data-theme="galaxy"] .title .sub { font-size: 14px !important; }
[data-theme="galaxy"] .icon-btn { border: 0; background: var(--surface); height: 38px; min-width: 38px; border-radius: 19px; }
[data-theme="galaxy"] .icon-btn.on { background: var(--turq); color: var(--on-turq); }
[data-theme="galaxy"] .tabs { background: var(--tabs-bg); border-radius: 22px; padding: 4px; }
[data-theme="galaxy"] .tab { height: 36px; border-radius: 18px; font-weight: 500; font-size: 14px; color: var(--muted); }
[data-theme="galaxy"] .tab.on { background: var(--tab-on); color: var(--tab-on-text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
[data-theme="galaxy"] .prog { height: 4px; border-radius: 2px; background: var(--line); }
[data-theme="galaxy"] .block, [data-theme="galaxy"] .q-card { border: 0; border-radius: 26px; }
[data-theme="galaxy"] .bhead { padding: 14px 18px; }
[data-theme="galaxy"] .bhead .lbl { font-size: 16px !important; font-weight: 600; color: var(--text); }
[data-theme="galaxy"] .witem { padding: 10px 18px; font-size: 14px; }
[data-theme="galaxy"] .witem.ck .txt { text-decoration-color: var(--dim); }
[data-theme="galaxy"] .box { border-radius: 50%; width: 22px; height: 22px; }
[data-theme="galaxy"] .wnote { padding: 10px 18px 14px; }
[data-theme="galaxy"] .thead { text-transform: none; letter-spacing: 0; font-size: 12px; padding-left: 18px; padding-right: 14px; }

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--text); font: 400 14px/1.35 'Onest', system-ui, sans-serif; }
body { min-height: 100vh; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea { font: inherit; color: var(--text); background: var(--surface2); border: 1px solid var(--line2); border-radius: 10px; padding: 9px 11px; width: 100%; outline: none; }
input:focus, textarea:focus { border-color: var(--turq); }
textarea { resize: vertical; min-height: 64px; line-height: 1.4; }
.hand { font-family: 'Caveat', cursive; font-weight: 700; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 12px; }

/* header */
header { position: sticky; top: 0; z-index: 20; background: var(--bg); padding-top: env(safe-area-inset-top); border-bottom: 1px solid var(--line); }
.hrow { display: flex; align-items: center; gap: 8px; padding: 10px 0 6px; }
.title { flex: 1; min-width: 0; position: relative; }
.title h1 { font: 800 22px/1 'Onest'; letter-spacing: -.01em; text-transform: uppercase; display: inline-block; position: relative; }
.title h1 svg { position: absolute; left: -2px; right: -4px; bottom: -7px; width: calc(100% + 6px); height: 9px; }
.title .sub { font-size: 20px; color: var(--hand); margin-left: 8px; line-height: 1; }
.icon-btn { height: 34px; min-width: 34px; padding: 0 10px; border-radius: 17px; border: 1px solid var(--line2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 12px; color: var(--text); }
.icon-btn.on { background: var(--turq); color: var(--on-turq); border-color: var(--turq); }
.icon-btn svg { width: 16px; height: 16px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface); border-radius: 12px; padding: 3px; margin-bottom: 8px; }
.tab { height: 32px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--muted); }
.tab small { font-weight: 500; font-size: 11px; opacity: .8; margin-left: 4px; }
.tab.on { background: var(--turq); color: var(--on-turq); }
.prog { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
.prog i { display: block; height: 100%; background: var(--emer); transition: width .3s; }

/* blocks */
.block { margin-top: 10px; background: var(--surface); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.bhead { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; text-align: left; }
.bhead .lbl { font-size: 22px; line-height: 1; color: var(--hand); }
.bhead .meta { flex: 1; color: var(--muted); font-size: 12px; }
.bhead .chev { color: var(--muted); transition: transform .2s; }
.bhead .chev.open { transform: rotate(180deg); }
.wlist { border-top: 1px solid var(--line); }
.witem { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; width: 100%; padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--line); font-size: 13px; }
.witem:last-child { border-bottom: 0; }
.witem .vol { color: var(--muted); font-size: 11.5px; text-align: right; max-width: 130px; }
.witem.ck .txt { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--scribble); }
.box { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line2); display: flex; align-items: center; justify-content: center; }
.box.on { background: var(--emer); border-color: var(--emer); color: var(--on-turq); }
.box svg { width: 12px; height: 12px; }
.wnote { padding: 8px 12px 10px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }

/* table */
.thead, .row { display: grid; grid-template-columns: 18px minmax(0,1fr) 46px 48px 36px 32px; gap: 6px; align-items: center; padding: 0 10px 0 12px; }
.thead { padding-top: 7px; padding-bottom: 7px; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--line); }
.thead span:nth-child(n+3) { text-align: center; }
.ex { border-bottom: 1px solid var(--line); position: relative; }
.ex:last-child { border-bottom: 0; }
.ex.done { background: var(--done-bg); }
.row { min-height: 46px; padding-top: 7px; padding-bottom: 7px; cursor: pointer; }
.num { font: 700 11px 'Onest'; color: var(--dim); }
.nm { font-weight: 600; font-size: 13.5px; line-height: 1.2; }
.ex.done .nm { color: var(--muted); }
.wu { font-size: 11px; color: var(--muted); margin-top: 2px; }
.wu b { font-weight: 600; color: var(--muted); }
.cell { text-align: center; font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; line-height: 1.1; white-space: nowrap; }
.cell small { display: block; font-weight: 500; font-size: 10px; line-height: 1.15; color: var(--muted); white-space: normal; margin-top: 1px; }
.cell.rest { font-weight: 500; color: var(--muted); font-size: 12px; }
.ck { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line2); display: flex; align-items: center; justify-content: center; justify-self: end; }
.ck.on { border-color: var(--emer); background: var(--emer); color: var(--on-turq); }
.ck svg { width: 16px; height: 16px; }
.sticker { display: inline-block; vertical-align: 1px; margin-left: 6px; transform: rotate(-5deg); background: var(--sticker); color: var(--on-sticker); font: 700 15px/1 'Caveat'; padding: 2px 6px 3px; border-radius: 4px; box-shadow: 0 1px 0 rgba(0,0,0,.3); pointer-events: auto; }
.more { padding: 2px 12px 12px 36px; font-size: 12.5px; color: var(--text); }
.more .g { color: var(--muted); font-size: 11.5px; margin-bottom: 6px; }
.more ul { list-style: none; display: flex; flex-direction: column; gap: 4px; }
.more li { position: relative; padding-left: 12px; line-height: 1.35; }
.more li::before { content: ''; position: absolute; left: 0; top: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--turq); }
.more .note { margin-top: 8px; padding: 8px 10px; border-radius: 10px; border: 1px dashed var(--line2); color: var(--muted); font-size: 12px; }
.more a { color: var(--turq); text-decoration: none; font-weight: 600; }
.libs { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.lib { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; }
.lib span { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.ill { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline; }
.ill i { font-style: normal; color: var(--dim); }
.lib small { color: var(--muted); font-size: 11.5px; line-height: 1.35; }
.tip { margin: 10px 2px 0; font-size: 11.5px; color: var(--dim); }

/* bottom bar */
.bbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: linear-gradient(to top, var(--bg) 70%, transparent); padding: 14px 12px calc(10px + env(safe-area-inset-bottom)); }
.bbar .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.btn { height: 46px; border-radius: 14px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; }
.btn.pri { background: var(--turq); color: var(--on-turq); }
.btn.org { background: var(--orange); color: var(--on-orange); }
.btn.sec { background: var(--surface2); border: 1px solid var(--line2); }
.btn.ghost { border: 1px solid var(--line2); }
.btn svg { width: 18px; height: 18px; }
.btn[disabled] { opacity: .45; }

/* sheet */
.ov { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 640px; background: var(--surface); border-radius: 20px 20px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line2); }
.sheet h3 { font: 700 16px/1.25 'Onest'; }
.sheet .q { font-size: 24px; color: var(--hand); line-height: 1; margin-bottom: 4px; }
.sheet p { color: var(--muted); font-size: 12.5px; margin: 4px 0 14px; }
.rirgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.rirgrid button { height: 54px; border-radius: 14px; background: var(--surface2); border: 1px solid var(--line2); font: 800 20px 'Onest'; }
.rirgrid button.on { background: var(--orange); color: var(--on-orange); border-color: var(--orange); }
.sheet .skip { margin-top: 10px; width: 100%; }

/* full screen pages */
.page { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.page header { border-bottom: 1px solid var(--line); }
.page .body { padding-bottom: calc(90px + env(safe-area-inset-bottom)); }
.q-card { margin-top: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.q-card .qt { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.q-card .qt b { font-weight: 700; font-size: 14px; }
.q-card .qt .n { font-size: 20px; color: var(--hand); line-height: 1; }
.q-card .hint { font-size: 11.5px; color: var(--dim); margin: -4px 0 8px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { min-height: 34px; padding: 6px 12px; border-radius: 17px; border: 1px solid var(--line2); background: var(--surface2); font-weight: 600; font-size: 13px; }
.opt.on { background: var(--turq); color: var(--on-turq); border-color: var(--turq); }
.opt.sm { min-height: 30px; min-width: 34px; padding: 4px 9px; font-size: 12.5px; }
.opt.warn.on { background: var(--orange); border-color: var(--orange); color: var(--on-orange); }
.sub-l { font-size: 11.5px; color: var(--muted); margin: 10px 0 5px; }
.rir-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.rir-row:last-child { border-bottom: 0; }
.rir-row .nm2 { font-size: 13px; font-weight: 600; }
.rir-row .nm2 small { display: block; font-weight: 400; color: var(--dim); font-size: 11px; }
.rir-row .opts { gap: 4px; flex-wrap: nowrap; }
.rir-row .opt.sm { min-width: 31px; padding: 4px 6px; }
.addc { margin-top: 8px; font-size: 12px; color: var(--turq); font-weight: 600; }
.cm { margin-top: 8px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.grid3 label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; }
.out { margin-top: 10px; }
.out textarea { min-height: 220px; font-size: 13.5px; background: var(--surface); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.actions .full { grid-column: 1 / -1; }

/* editor */
.ed { padding: 12px; border-bottom: 1px solid var(--line); }
.ed:last-child { border-bottom: 0; }
.ed-h { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.ed-h .num { width: 18px; }
.ed-h input { flex: 1; font-weight: 600; }
.mv { width: 32px; height: 36px; border-radius: 9px; border: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; }
.mv[disabled] { opacity: .3; }
.steps { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stp label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.stp .c { display: grid; grid-template-columns: 34px 1fr 34px; height: 36px; border: 1px solid var(--line2); border-radius: 10px; overflow: hidden; background: var(--surface2); }
.stp .c button { font-size: 18px; font-weight: 700; color: var(--turq); }
.stp .c input { border: 0; border-radius: 0; text-align: center; padding: 0; background: transparent; font-weight: 700; }
.ed .lbl2 { font-size: 11px; color: var(--muted); margin: 10px 0 4px; }
.ed .row2 { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: 8px; }
.chg { font-size: 11px; color: var(--orange); }
.link-btn { font-size: 12px; color: var(--turq); font-weight: 600; }
.wurow { display: grid; grid-template-columns: 1fr 1fr 70px 30px; gap: 6px; align-items: end; margin-top: 6px; }
.wurow .stp .c { grid-template-columns: 28px 1fr 28px; }
.del { height: 36px; border-radius: 9px; border: 1px solid var(--line2); color: var(--muted); }

.toast { transition: opacity .2s; pointer-events: none; position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60; background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 12px; font-weight: 600; font-size: 13px; white-space: nowrap; }
.hidden { display: none !important; }
</style>

<div id="app"></div>
<script>
'use strict';
const KEY = 'strength-tracker-v3';

const W = (s, r, w, rest) => ({ s, r, w, rest });
const MAHI_NOTE = 'Зачёт по первым трём подходам. Если в 4-м подходе меньше 12 повторов — в следующий раз 4-й подход с гантелями на шаг легче.';
const PROG = [
  { label: 'День 1', wd: 'Пн', ex: [
    { id: 'd1e1', name: 'Жим ногами', short: 'жим ногами', garmin: 'Жим ногами', warm: [W(1, 5, 180, '1:30')], sets: 3, reps: 5, unit: 'r', w: 260, kind: 'leg', rest: '2:30', tech: 'Стопы на ширине плеч в середине платформы; колени по линии носков, не внутрь; вниз до ~90° в коленях, таз и поясница прижаты; наверху колени не защёлкивать, толкать всей стопой' },
    { id: 'd1e2', name: 'Румынская тяга на блоке', short: 'румынская тяга', garmin: 'Становая тяга на прямых ногах', warm: [W(1, 5, 15, '0:45')], sets: 3, reps: 8, unit: 'r', w: 27.5, kind: 'machine', rest: '1:30', tech: 'Стоять вплотную к блоку, чтобы трос шёл почти вертикально; колени чуть согнуты и не меняют угол; таз назад, спина ровная; вниз до натяжения задней поверхности бедра; вверх — таз вперёд, сжать ягодицы, без прогиба назад' },

}
async function copyText(t) {

}
async function download(name, text, type) {
  const C = window.Capacitor;
  if (C && C.isNativePlatform && C.isNativePlatform()) {
    try {
      const P = C.Plugins || {}, FS = P.Filesystem || C.registerPlugin('Filesystem'), SH = P.Share || C.registerPlugin('Share');
      const { uri } = await FS.writeFile({ path: name, data: text, directory: 'CACHE', encoding: 'utf8' });
      await SH.share({ title: name, files: [uri], dialogTitle: 'Отправить файл' }); return;
    } catch (err) { if (!/cancel/i.test(String(err && err.message))) toast('Не удалось поделиться файлом'); return; }
  }
  try { const file = new File([text], name, { type }); if (navigator.canShare && navigator.canShare({ files: [file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) { await navigator.share({ files: [file], title: name }); return; } } catch (err) { if (err && err.name === 'AbortError') return; }
  const u = URL.createObjectURL(new Blob([text], { type })), a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000);
}

      save(); break;
    }
    case 'rir': UI.sheet = id; break;
    case 'setRir': rir()[UI.sheet] = t.dataset.v; UI.sheet = null; save(); break;
    case 'closeSheet': UI.sheet = null; break;
    case 'goStrength': UI.page = 'strength'; UI.keepScrollReset = true; window.scrollTo(0, 0); break;
    case 'goRun': UI.page = 'run'; UI.keepScrollReset = true; window.scrollTo(0, 0); break;
    case 'back': UI.page = null; UI.keepScrollReset = true; window.scrollTo(0, 0); break;
    case 'rirSet': { const r = rir(); if (r[id] === t.dataset.v) delete r[id]; else r[id] = t.dataset.v; save(); break; }
    case 'opt': {
      const f = curForm(), fld = t.dataset.f, v = t.dataset.v;
      if (t.dataset.m) { let arr = [...(f[fld] || [])]; if (arr.includes(v)) arr = arr.filter(x => x !== v); else { arr = v === 'обычные' ? ['обычные'] : [...arr.filter(x => x !== 'обычные'), v]; } f[fld] = arr; }
      else f[fld] = f[fld] === v ? '' : v;
      save(); break;
    }
    case 'addc': UI.cOpen[t.dataset.k] = true; render(); { const tas = document.querySelectorAll('textarea.cm'); const el = [...tas].find(x => x.dataset.f && UI.page + x.dataset.f === t.dataset.k); el && el.focus(); } return;
    case 'painEx': { const f = sForm(); const arr = f.painEx || []; f.painEx = arr.includes(id) ? arr.filter(x => x !== id) : [...arr, id]; save(); break; }
    case 'fillMissed': { const f = sForm(); f.devC = 'не сделано: ' + dayEx(S.day).filter(e => !done()[e.id]).map(e => e.short || e.name).join(', '); save(); break; }
    case 'genS': genStrength(); save(); render(); document.getElementById('out')?.scrollIntoView({ behavior: 'smooth' }); return;
    case 'genR': genRun(); save(); render(); document.getElementById('out')?.scrollIntoView({ behavior: 'smooth' }); return;
    case 'copy': { const f = curForm(); copyText(f.out).then(ok => toast(ok ? 'Скопировано' : 'Не удалось скопировать')); return; }
    case 'finishS': if (!confirm('Сбросить отметки, RIR и ответы этого дня? Последний отчёт сохранится в копии.')) return;
      S.done[S.day] = {}; S.rir[S.day] = {}; S.sForm[S.day] = blankS(); S.warm[S.day] = {}; S.warmOpen = null; UI.cOpen = {}; UI.page = null; save(); render(); toast('Тренировка завершена'); return;
    case 'clearR': if (!confirm('Очистить ответы беговой тренировки?')) return; S.rForm = blankR(); UI.cOpen = {}; save(); break;
    case 'stp': {
      const e = dayEx(S.day).find(x => x.id === id), f = t.dataset.f, d = +t.dataset.d;
      if (f === 'sets') setEdit(id, { sets: Math.max(1, Math.min(10, e.sets + d)) });
      else if (f === 'reps') setEdit(id, { reps: Math.max(1, e.reps + d * (e.unit === 'sec' ? 5 : 1)) });
      else if (f === 'w') setEdit(id, { w: Math.max(0, Math.round(((e.w || 0) + d * (STEP[e.kind] || 2.5)) * 100) / 100) });
      else { const k = +f.slice(2), warm = e.warm.map(x => ({ ...x })); if (f[1] === 'r') warm[k].r = Math.max(1, warm[k].r + d); else warm[k].w = Math.max(0, Math.round((warm[k].w + d * (STEP[e.kind] || 2.5)) * 100) / 100); setEdit(id, { warm }); }
      break;
    }
    case 'wadd': { const e = dayEx(S.day).find(x => x.id === id); setEdit(id, { warm: [...e.warm.map(x => ({ ...x })), { s: 1, r: 5, w: Math.round((e.w || 0) * 0.6 / (STEP[e.kind] || 2.5)) * (STEP[e.kind] || 2.5), rest: '1:00' }] }); break; }
    case 'wdel': { const e = dayEx(S.day).find(x => x.id === id); setEdit(id, { warm: e.warm.filter((_, k) => k !== +t.dataset.k) }); break; }
    case 'reset': if (!confirm('Вернуть упражнение к программе?')) return; delete S.edits[id]; save(); break;
    case 'mv': { const ids = dayEx(S.day).map(e => e.id), i = +t.dataset.i, j = i + +t.dataset.d; [ids[i], ids[j]] = [ids[j], ids[i]]; S.order[S.day] = ids; save(); break; }
    case 'resetOrder': delete S.order[S.day]; save(); break;
    case 'backup': download(`trener-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: KEY, exported: new Date().toISOString(), data: S }, null, 2), 'application/json'); return;
  }
  render();
});
document.addEventListener('input', ev => {
  const t = ev.target, k = t.dataset.in; if (!k) return;
  const id = t.dataset.id;
  if (t.tagName === 'TEXTAREA') autosize(t);
  if (k === 'f') { curForm()[t.dataset.f] = t.value; save(); return; }
  if (k === 'name') { setEdit(id, { name: t.value.trim() ? t.value : PROG.flatMap(d => d.ex).find(e => e.id === id).name }); return; }
  if (k === 'rest') { setEdit(id, { rest: t.value }); return; }
  if (k === 'tech') { const base = PROG.flatMap(d => d.ex).find(e => e.id === id); const def = techList(base).join('\n'); const e = { ...(S.edits[id] || {}) }; if (t.value.trim() === def.trim()) delete e.tech; else e.tech = t.value; if (Object.keys(e).length) S.edits[id] = e; else delete S.edits[id]; save(); return; }
  if (k === 'link') { const v = t.value.trim(); if (v) S.links[id] = /^https?:\/\//i.test(v) ? v : 'https://' + v; else delete S.links[id]; save(); return; }
  if (k.startsWith('wrest')) { const e = dayEx(S.day).find(x => x.id === id), warm = e.warm.map(x => ({ ...x })); warm[+k.slice(5)].rest = t.value; setEdit(id, { warm }); return; }
});
document.addEventListener('change', ev => {
  const t = ev.target, k = t.dataset.in; if (!k) return;
  const id = t.dataset.id;
  if (k === 'num') {
    const e = dayEx(S.day).find(x => x.id === id), f = t.dataset.f, v = num(t.value);
    if (f === 'sets') setEdit(id, { sets: Math.max(1, Math.round(v)) });
    else if (f === 'reps') setEdit(id, { reps: Math.max(1, Math.round(v)) });
    else if (f === 'w') setEdit(id, { w: t.value.trim() === '' ? null : Math.max(0, v) });
    else { const kk = +f.slice(2), warm = e.warm.map(x => ({ ...x })); if (f[1] === 'r') warm[kk].r = Math.max(1, Math.round(v)); else warm[kk].w = Math.max(0, v); setEdit(id, { warm }); }
    render(); return;
  }
  if (k === 'restore') {
    const file = t.files && t.files[0]; t.value = ''; if (!file) return;
    file.text().then(txt => {
      const j = JSON.parse(txt), d = j.data || j;
      if (!d || typeof d !== 'object' || !('edits' in d || 'custom' in d)) throw new Error('bad');
      if (!confirm('Заменить текущие данные данными из копии?')) return;
      if ('edits' in d) S = Object.assign(load(), d);
      else { localStorage.setItem(OLD_KEY, JSON.stringify(d)); localStorage.removeItem(KEY); S = load(); }
      save(); render(); toast('Данные восстановлены');
    }).catch(() => toast('Не удалось прочитать файл'));
  }
  if (k === 'name' || k === 'rest' || k === 'tech' || k.startsWith('wrest')) render();
});
window.addEventListener('pagehide', save);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.theme === 'galaxy') render(); }); } catch (e) {}
render();
</script>
