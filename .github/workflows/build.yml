{
"name": "Build APK",
"on": ["push", "workflow_dispatch"],
"permissions": {"contents": "write"},
"jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [
{"uses": "actions/checkout@v4"},
{"uses": "actions/setup-node@v4", "with": {"node-version": 20}},
{"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": 21}},
{"name": "Install", "run": "npm install"},
{"name": "Android project", "run": "npx cap add android"},
{"name": "App icon", "run": "npx --yes @capacitor/assets@3 generate --android --assetPath assets"},
{"name": "Sync", "run": "npx cap sync android"},
{"name": "Signing and version", "run": "set -e\nF=android/app/build.gradle\nsed -i -E \"s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \\\"[^\\\"]*\\\"/versionName \\\"1.${{ github.run_number }}\\\"/\" $F\nprintf '%s\\n' '' 'android {' '    signingConfigs {' '        debug {' \"            storeFile rootProject.file('../keystore/debug.keystore')\" \"            storePassword 'android'\" \"            keyAlias 'androiddebugkey'\" \"            keyPassword 'android'\" '        }' '    }' '    buildTypes { debug { signingConfig signingConfigs.debug } }' '}' >> $F\ngrep -E 'versionCode|versionName' $F"},
{"name": "Build APK", "run": "cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon && cp app/build/outputs/apk/debug/app-debug.apk ../silovoy-treker.apk"},
{"name": "Check signature", "run": "BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)\n$BT/apksigner verify --print-certs silovoy-treker.apk | grep -i 'SHA-256'\necho 'Ожидаемый ключ: e1b421bf68f74f6984e06b91342f55831f850022e630f7821156b9bce1c101b1'"},
{"name": "Release", "uses": "softprops/action-gh-release@v2", "with": {"tag_name": "build-${{ github.run_number }}", "name": "Build ${{ github.run_number }}", "files": "silovoy-treker.apk", "make_latest": true}}
]}}
}
